# ADVANCED V1 ONLY. Active v2 parameters are in notebooks/05_advanced_models.ipynb.
# Week 5 milestone 1: lexical-only. Brand ablation waits for Hy.
[experiment]
name = "week5_lexical_models"
seed = 42
feature_set = "lexical_12"
threads = 1

[evaluation]
n_splits = 3
inner_splits = 2
calibration_splits = 2
primary_metric = "average_precision"
decision_threshold = 0.5
use_test = false
validation_role = "supplementary"

# Fixed E1 references. Other families are tuned using inner group CV only.
[[candidates.logistic_regression]]
class_weight = "none"
C = 1.0
max_iter = 2000

[[candidates.logistic_regression_balanced]]
class_weight = "balanced"
C = 1.0
max_iter = 2000

[[candidates.svm_rbf]]
C = 0.5
gamma = "scale"
class_weight = "none"

[[candidates.svm_rbf]]
C = 2.0
gamma = "scale"
class_weight = "none"

[[candidates.mlp]]
hidden_layer_sizes = [32]
alpha = 0.001
max_iter = 1000

[[candidates.mlp]]
hidden_layer_sizes = [32, 16]
alpha = 0.001
max_iter = 1000

[[candidates.hist_gradient_boosting]]
max_iter = 150
max_leaf_nodes = 7
learning_rate = 0.1
l2_regularization = 1.0

[[candidates.hist_gradient_boosting]]
max_iter = 150
max_leaf_nodes = 15
learning_rate = 0.1
l2_regularization = 1.0
