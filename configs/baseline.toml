# Week-4 E1: fixed folds/threshold; validation supplementary; test held out.
[experiment]
name = "week4_e1_core_lr"
seed = 42

[data]
dataset_file = "dataset_url.csv"
core_tiers = ["gold", "silver"]
id_column = "id"
url_column = "url"
label_column = "label"
split_column = "split"
positive_label = "phishing"
negative_label = "benign"

[evaluation]
strategy = "group_cv_on_official_train"
group_column = "registrable_domain"
n_splits = 3
require_both_classes_per_fold = true
validation_role = "supplementary"
use_test = false
decision_threshold = 0.5

[features]
reference_schema = "Hy official 12 lexical features (dictionary in reports/templates)"
excluded_columns = ["is_https", "source", "tier", "split", "status", "scenario", "abuse_type", "id"]
# Use CANDIDATE_FEATURES from the merged Hy extractor; metadata is not part of X.

[model]
baseline = "logistic_regression"
reference = "dummy_most_frequent"
scaling = "standard_scaler_within_fold"
compare_balanced = true
max_iter = 2000
selection_metric = "mean_group_cv_f1_phishing"
# Standard and balanced LR share the same folds and fixed threshold.
