name: Week 6 benchmark checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teacher-and-unit-tests:
    name: Teacher fixtures and unit suite (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared teacher and test dependencies
        run: python -m pip install -e ".[teacher,test]"
      - name: Check installed dependencies
        run: |
          python -m pip check
          python -c "import nbformat, IPython, lightgbm, xgboost, catboost, imblearn"
      - name: Run Teacher fixture tests (no training on project data)
        run: python -m pytest tests/test_teacher_week6.py -q -rs --junitxml=test-results/teacher.xml
      - name: Reject skipped or missing Teacher tests
        run: |
          python -c "import xml.etree.ElementTree as E; cases=E.parse('test-results/teacher.xml').findall('.//testcase'); assert len(cases)>=13, 'Teacher tests missing'; assert all(c.find('skipped') is None for c in cases), 'Teacher tests must not skip'"
      - name: Run full available suite
        run: python -m pytest -q -rs --junitxml=test-results/full.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-test-reports
          path: test-results/*.xml
          if-no-files-found: warn
