name: Week 6 benchmark checks

on:
  pull_request:
    branches: [main, phuc-week6-teacher-v1]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teacher-and-unit-tests:
    name: Teacher fixtures and unit suite (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared teacher and test dependencies
        run: python -m pip install -e ".[teacher,test]"
      - name: Check installed dependencies
        run: |
          python -m pip check
          python -c "import nbformat, IPython, lightgbm, xgboost, catboost, imblearn"
      - name: Run Teacher fixture tests (no training on project data)
        run: python -m pytest tests/test_teacher_week6.py -q -rs --junitxml=test-results/teacher.xml
      - name: Reject skipped or missing Teacher tests
        run: |
          python -c "import xml.etree.ElementTree as E; cases=E.parse('test-results/teacher.xml').findall('.//testcase'); assert len(cases)>=13, 'Teacher tests missing'; assert all(c.find('skipped') is None for c in cases), 'Teacher tests must not skip'"
      - name: Run stacking and portable candidate fixtures
        run: |
          python -m pytest tests/test_stacking.py -q -rs --junitxml=test-results/stacking.xml
          python -c "import xml.etree.ElementTree as E; cases=E.parse('test-results/stacking.xml').findall('.//testcase'); assert len(cases)>=53; assert all(c.find('skipped') is None for c in cases)"
      - name: Run full available suite
        run: python -m pytest -q -rs --junitxml=test-results/full.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-test-reports
          path: test-results/*.xml
          if-no-files-found: warn

  research-fixtures:
    name: URL research fixtures (no project training)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU research dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test,research]"
          python -m pip check
      - name: Test preprocessing and neural fixtures
        run: |
          python -m pytest tests/test_url_research.py -q -rs --junitxml=test-results/research.xml
          python -c "import xml.etree.ElementTree as E; cases=E.parse('test-results/research.xml').findall('.//testcase'); assert len(cases)>=26; assert all(c.find('skipped') is None for c in cases)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-test-reports
          path: test-results/research.xml
