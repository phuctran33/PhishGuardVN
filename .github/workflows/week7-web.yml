name: Week 7 QA

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      web_sha:
        description: Full Web source commit SHA; blank uses this checkout or the pinned handoff
        required: false
        type: string
      student_sha:
        description: Full LightGBM regression source SHA; MLP uses its separate pinned handoff
        required: false
        type: string
      android_sha:
        description: Full Hy Android source commit SHA; blank uses the pinned handoff
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: week7-web-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"
  # Update after receiving and reviewing Hung's next handoff. Never follow a moving branch.
  WEB_HANDOFF_SHA: "5f112fc597339ea213eff3f07c745629cc18d8fc"
  STUDENT_HANDOFF_SHA: "1cad94c88195ebea6e4737bbfc863cbe4b2ff384"
  STUDENT_MLP_HANDOFF_SHA: "bc3a3a7054e2f6e6e733595f40f38439784536a1"
  ANDROID_MLP_HANDOFF_SHA: "f817ec96eee8f5301c06bae6c59b0059b9fe3d78"
  ANDROID_HANDOFF_SHA: "a4d7b0e8e7d7845368bb3061c8e754c7cbe1224e"
  QA_API_PORT: "18767"
  PYTHONIOENCODING: utf-8
  OMP_NUM_THREADS: "1"
  CI: "true"

jobs:
  web:
    name: Web and Android host / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out QA tests and workflow
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select the exact Web source revision
        id: source
        env:
          REQUESTED_WEB_SHA: ${{ inputs.web_sha }}
        run: |
          mkdir -p test-results/week7
          if [[ -n "$REQUESTED_WEB_SHA" ]]; then
            web_sha="$REQUESTED_WEB_SHA"
          elif [[ -f apps/web/test/week7_test.dart && -f src/phishguard_vn/url_inspection.py ]]; then
            web_sha="$(git rev-parse HEAD)"
          else
            web_sha="$WEB_HANDOFF_SHA"
          fi
          if [[ ! "$web_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Web source must be a full 40-character commit SHA." >&2
            exit 1
          fi
          web_sha="${web_sha,,}"
          echo "sha=$web_sha" >> "$GITHUB_OUTPUT"
          printf 'QA revision: %s\nWeb revision: %s\nRunner: %s\n' \
            "$GITHUB_SHA" "$web_sha" "$RUNNER_OS" | tee test-results/week7/source.txt
          cat test-results/week7/source.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the selected source separately
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: web-source
          persist-credentials: false

      - name: Select the exact Android handoff revision
        id: android
        env:
          REQUESTED_ANDROID_SHA: ${{ inputs.android_sha }}
        run: |
          android_sha="${REQUESTED_ANDROID_SHA:-$ANDROID_HANDOFF_SHA}"
          if [[ ! "$android_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Android source must be a full 40-character commit SHA." >&2
            exit 1
          fi
          android_sha="${android_sha,,}"
          echo "sha=$android_sha" >> "$GITHUB_OUTPUT"
          printf 'Android revision: %s\n' "$android_sha" | tee -a test-results/week7/source.txt
          printf 'Android revision: %s\n' "$android_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the Android source separately
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.android.outputs.sha }}
          path: android-source
          persist-credentials: false

      - name: Verify source revision and required files
        env:
          EXPECTED_WEB_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_ANDROID_SHA: ${{ steps.android.outputs.sha }}
        run: |
          test "$(git -C web-source rev-parse HEAD)" = "$EXPECTED_WEB_SHA"
          test -f web-source/apps/web/pubspec.lock
          test -f web-source/requirements-teacher.txt
          test -f web-source/configs/teacher_lock.json
          test "$(git -C android-source rev-parse HEAD)" = "$EXPECTED_ANDROID_SHA"
          test -f android-source/mobile/app/lib/src/teacher_loader.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Record Flutter and Dart versions
        run: flutter --version --machine > test-results/week7/flutter-version.json

      - name: Install locked Web dependencies
        working-directory: web-source/apps/web
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Analyze Flutter Web
        working-directory: web-source/apps/web
        run: flutter analyze --no-pub 2>&1 | tee ../../../test-results/week7/flutter-analyze.log

      - name: Run Flutter Web tests
        working-directory: web-source/apps/web
        run: |
          flutter test --no-pub --reporter expanded \
            --file-reporter=json:../../../test-results/week7/flutter-tests.json \
            2>&1 | tee ../../../test-results/week7/flutter-tests.log

      - name: Build release Web without CDN resources
        working-directory: web-source/apps/web
        run: |
          flutter build web --release --no-pub --no-web-resources-cdn \
            "--dart-define=API_BASE_URL=http://127.0.0.1:$QA_API_PORT" \
            2>&1 | tee ../../../test-results/week7/flutter-build.log

      - name: Set up Python for real Teacher and API QA
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            web-source/requirements-teacher.txt
            web-source/pyproject.toml

      - name: Install the selected API source and frozen Teacher runtime
        shell: pwsh
        run: |
          python -m venv web-source/.venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $qaPython = if ($IsWindows) { 'web-source/.venv/Scripts/python.exe' } else { 'web-source/.venv/bin/python' }
          $qaPython = (Resolve-Path $qaPython).Path
          "QA_PYTHON=$qaPython" >> $env:GITHUB_ENV
          & $qaPython -m pip install -r web-source/requirements-teacher.txt -e './web-source[api,test,teacher]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $qaPython -m pip check

      - name: Run upstream API inspection and Teacher regression
        shell: pwsh
        working-directory: web-source
        run: |
          & $env:QA_PYTHON -m pytest -p no:cacheprovider -q -rs --tb=short tests/test_url_inspection.py tests/test_api.py tests/test_api_teacher.py --junitxml=../test-results/week7/api.xml

      - name: Run independent inspection and frozen-contract QA
        shell: pwsh
        run: |
          & $env:QA_PYTHON -m pytest -p no:cacheprovider -q -rs --tb=short tests/week7/inspection_qa.py --teacher-root=web-source --junitxml=test-results/week7/inspection-qa.xml

      - name: Reuse the required released Teacher acceptance gate
        shell: pwsh
        run: |
          & $env:QA_PYTHON -m pytest -p no:cacheprovider -q -rs --tb=short tests/test_teacher_integration.py --teacher-root=web-source --teacher-api -m teacher_api --junitxml=test-results/week7/teacher-qa.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:QA_PYTHON -c "import xml.etree.ElementTree as E; c=E.parse('test-results/week7/teacher-qa.xml').findall('.//testcase'); assert len(c)>=15; assert all(x.find('skipped') is None for x in c)"

      - name: Run the selected source regression suite
        shell: pwsh
        working-directory: web-source
        run: |
          & $env:QA_PYTHON -m pytest -p no:cacheprovider -q -rs --tb=short --teacher-root=. --teacher-api -k "not test_real_external_bundle_matches_saved_scores" --junitxml=../test-results/week7/full.xml

      - name: Run existing Dart package regression
        working-directory: android-source/mobile/packages/phishguard_features
        run: |
          dart pub get
          dart test --reporter expanded \
            --file-reporter=json:../../../../test-results/week7/dart-tests.json \
            2>&1 | tee ../../../../test-results/week7/dart-tests.log

      - name: Prepare the documented Flutter app assets
        shell: pwsh
        run: |
          $qaRoot = (Resolve-Path android-source).Path
          $qaAssets = Join-Path $qaRoot 'mobile/app/assets'
          New-Item -ItemType Directory -Force $qaAssets | Out-Null
          $qaSources = @('src/phishguard_vn/resources/brand_reference_v1.csv', 'mobile/packages/phishguard_features/assets/psl_icann_tldextract_5.4.0.txt', 'docs/mobile_parity_cases.json', 'docs/mobile_parity_cases_extra.json', 'artifacts/teacher_v2_android/dart_svm_model.json', 'artifacts/teacher_v2_android/dart_teacher_v2_model.json', 'artifacts/teacher_v2_android/manifest.json')
          foreach ($qaRelative in $qaSources) {
            $qaOriginal = Join-Path $qaRoot $qaRelative
            $qaName = if ($qaRelative -eq 'artifacts/teacher_v2_android/manifest.json') { 'teacher_v2_manifest.json' } else { Split-Path $qaOriginal -Leaf }
            $qaCopy = Join-Path $qaAssets $qaName
            Copy-Item -LiteralPath $qaOriginal -Destination $qaCopy
            if ((Get-FileHash $qaOriginal).Hash -ne (Get-FileHash $qaCopy).Hash) { throw "Asset copy mismatch: $qaRelative" }
          }

      - name: Analyze and test Hy Teacher app on the host
        working-directory: android-source/mobile/app
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          flutter analyze --no-pub 2>&1 | tee ../../../test-results/week7/mobile-analyze.log
          flutter test --no-pub --reporter expanded \
            --file-reporter=json:../../../test-results/week7/mobile-tests.json \
            2>&1 | tee ../../../test-results/week7/mobile-tests.log

      - name: Generate fresh released Python Teacher outputs for Android parity
        shell: pwsh
        run: |
          & $env:QA_PYTHON tests/week7/android_reference.py --android-root=android-source --output=test-results/week7/android-python.json

      - name: Run independent Android host parity and loading QA
        shell: pwsh
        run: |
          $qaReference = (Resolve-Path test-results/week7/android-python.json).Path
          $qaTest = (Resolve-Path android-source/mobile/app/.dart_tool/week7_teacher_qa_test.dart).Path
          $qaOutput = Join-Path $env:GITHUB_WORKSPACE 'test-results/week7/android-host-parity.json'
          $qaReporter = Join-Path $env:GITHUB_WORKSPACE 'test-results/week7/android-host-tests.json'
          Push-Location android-source/mobile/app
          flutter test --no-pub $qaTest "--dart-define=QA_ANDROID_REFERENCE=$qaReference" "--dart-define=QA_ANDROID_OUTPUT=$qaOutput" --reporter expanded "--file-reporter=json:$qaReporter"
          $qaExit = $LASTEXITCODE
          Pop-Location
          exit $qaExit

      - name: Require complete Web Dart and Flutter results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as E
          root = Path('test-results/week7')
          for name, minimum in [('flutter-tests.json', 48), ('dart-tests.json', 294), ('mobile-tests.json', 46), ('android-host-tests.json', 5)]:
              rows = [json.loads(line) for line in (root / name).read_text(encoding='utf-8').splitlines() if line.strip()]
              assert rows[-1]['type'] == 'done' and rows[-1]['success'] is True, name
              cases = [r for r in rows if r['type'] == 'testDone' and not r.get('hidden', False)]
              assert len(cases) >= minimum, f'{name}: missing tests'
              assert all(r['result'] == 'success' and not r['skipped'] for r in cases), name
          for name, minimum in [('api.xml', 73), ('inspection-qa.xml', 25), ('teacher-qa.xml', 15)]:
              cases = E.parse(root / name).findall('.//testcase')
              assert len(cases) >= minimum, f'{name}: missing tests'
              assert all(c.find(tag) is None for c in cases for tag in ('skipped', 'failure', 'error')), name
          reference = json.loads((root / 'android-python.json').read_text(encoding='utf-8'))
          parity = json.loads((root / 'android-host-parity.json').read_text(encoding='utf-8'))
          assert parity['status'] == 'passed' and not parity['failures']
          assert parity['source_revision'] == reference['source_revision']
          assert parity['classified_matched'] >= 47 and parity['rejected_matched'] >= 9
          assert parity['max_absolute_delta'] <= parity['absolute_tolerance'] == 1e-6
          PY

      # Browser acceptance is scoped to Windows; host regression still covers both OSes.
      - name: Set up Node.js
        if: runner.os == 'Windows'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/week7/package-lock.json

      - name: Install locked browser QA dependencies
        if: runner.os == 'Windows'
        run: npm --prefix tests/week7 ci --no-audit --no-fund

      - name: Install Chromium and system dependencies
        if: runner.os == 'Windows'
        working-directory: tests/week7
        run: npx playwright install --with-deps chromium

      # Retain the original QA-W7-WEB-01 keyboard repro as a strict regression gate.
      - name: Real browser QR inspection and Teacher smoke
        if: runner.os == 'Windows'
        run: |
          qa_chromium_path="$(node -p "require('./tests/week7/node_modules/playwright').chromium.executablePath()")"
          node tests/week7/web_smoke.cjs --handoff-root=web-source \
            "--chrome=$qa_chromium_path" "--api-port=$QA_API_PORT" \
            --output=test-results/week7/browser.json

      - name: Upload Web QA evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week7-web-${{ matrix.os }}
          path: test-results/week7/
          if-no-files-found: warn
          retention-days: 14

  student:
    name: Student Python and Dart / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out QA tests
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select the exact Student source revision
        id: source
        env:
          REQUESTED_STUDENT_SHA: ${{ inputs.student_sha }}
        run: |
          mkdir -p test-results/student
          student_sha="${REQUESTED_STUDENT_SHA:-$STUDENT_HANDOFF_SHA}"
          if [[ ! "$student_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Student source must be a full 40-character commit SHA." >&2
            exit 1
          fi
          student_sha="${student_sha,,}"
          echo "sha=$student_sha" >> "$GITHUB_OUTPUT"
          printf 'QA revision: %s\nStudent revision: %s\nRunner: %s\n' \
            "$GITHUB_SHA" "$student_sha" "$RUNNER_OS" | tee test-results/student/source.txt
          cat test-results/student/source.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the Student handoff separately
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: student-source
          persist-credentials: false

      - name: Verify Student source and record assets
        env:
          EXPECTED_STUDENT_SHA: ${{ steps.source.outputs.sha }}
        run: |
          test "$(git -C student-source rev-parse HEAD)" = "$EXPECTED_STUDENT_SHA"
          test -f student-source/artifacts/student_lightgbm/manifest.json
          cp student-source/artifacts/student_lightgbm/manifest.json test-results/student/artifact-manifest.json

      - name: Set up Python for Student artifact verification
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            student-source/requirements-teacher.txt
            student-source/pyproject.toml

      - name: Install frozen runtime and native parity dependency
        run: |
          python -m pip install -r student-source/requirements-teacher.txt -e './student-source[test]' lightgbm==4.7.0
          python -m pip check
          python --version > test-results/student/python-version.txt
          python -m pip freeze > test-results/student/requirements-installed.txt

      - name: Run independent Student artifact and edge-case QA
        run: python -m pytest -p no:cacheprovider -q -rs --tb=short tests/week7/student_qa.py --junitxml=test-results/student/independent.xml

      - name: Run the handed-off LightGBM and existing Student tests
        working-directory: student-source
        run: |
          python -m pytest -p no:cacheprovider -q -rs --tb=short tests/test_student_lightgbm.py --junitxml=../test-results/student/lightgbm.xml
          python -m pytest -p no:cacheprovider -q -rs --tb=short tests/test_student.py tests/test_student_comparison.py --junitxml=../test-results/student/regression.xml

      - name: Check out the MLP int8 handoff separately
        uses: actions/checkout@v7
        with:
          ref: ${{ env.STUDENT_MLP_HANDOFF_SHA }}
          path: student-mlp-source
          persist-credentials: false

      - name: Verify MLP revision and run independent bundle QA
        env:
          QA_STUDENT_MLP_ROOT: ${{ github.workspace }}/student-mlp-source
          QA_STUDENT_MLP_OUTPUT: ${{ github.workspace }}/test-results/student/mlp-python.json
        run: |
          set -euo pipefail
          test "$(git -C student-mlp-source rev-parse HEAD)" = "$STUDENT_MLP_HANDOFF_SHA"
          printf 'MLP revision: %s\n' "$STUDENT_MLP_HANDOFF_SHA" | tee test-results/student/mlp-source.txt
          cat test-results/student/mlp-source.txt >> "$GITHUB_STEP_SUMMARY"
          cp student-mlp-source/artifacts/student_mlp_android/manifest.json test-results/student/mlp-manifest.json
          python -m pytest -p no:cacheprovider -q -rs --tb=short tests/week7/student_mlp_qa.py --junitxml=test-results/student/mlp-independent.xml

      - name: Run upstream MLP int8 handoff tests
        working-directory: student-mlp-source
        run: python -m pytest -p no:cacheprovider -q -rs --tb=short tests/test_android_student_mlp.py --junitxml=../test-results/student/mlp-upstream.xml

      - name: Set up Flutter for experimental Student adapter QA
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Prepare verified Student assets and fresh Python reference
        run: python tests/week7/prepare_student_android.py --student-root=student-source --output=test-results/student/live-python-reference.json
      - name: Analyze and test the separate Student Dart adapter
        working-directory: tests/week7/student_android
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --machine --dart-define=QA_STUDENT_OUTPUT="$GITHUB_WORKSPACE/test-results/student/dart-parity.json" > "$GITHUB_WORKSPACE/test-results/student/dart-tests.json"
      - name: Verify generated QA app and bundled assets on host
        run: |
          set -euo pipefail
          python tests/week7/prepare_student_runtime.py
          cd tests/week7/student_android/.android_harness
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --machine test/bootstrap_test.dart > "$GITHUB_WORKSPACE/test-results/student/qa-app-tests.json"

      - name: Require complete Student results without skips
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          for name, minimum in [('independent.xml', 43), ('lightgbm.xml', 3), ('regression.xml', 29), ('mlp-independent.xml', 86), ('mlp-upstream.xml', 2)]:
              cases = E.parse(Path('test-results/student') / name).findall('.//testcase')
              assert len(cases) >= minimum, f'{name}: missing tests'
              assert all(c.find(tag) is None for c in cases for tag in ('skipped', 'failure', 'error')), name
          import json
          mlp = json.loads(Path('test-results/student/mlp-python.json').read_text(encoding='utf-8'))
          assert mlp['status'] == 'passed' and mlp['source_revision'] == 'bc3a3a7054e2f6e6e733595f40f38439784536a1'
          assert mlp['model_version'] == 'student-mlp-kd-int8-v1' and mlp['threshold'] == 0.72961075
          assert mlp['classified_matched'] == 54 and mlp['rejected_matched'] == 9
          assert mlp['max_fixture_score_delta'] <= mlp['absolute_tolerance'] == 2e-6
          assert mlp['independent_int8_max_delta'] <= 1e-12
          events = [json.loads(line) for line in Path('test-results/student/dart-tests.json').read_text().splitlines() if line.startswith('{')]
          completed = [event for event in events if event.get('type') == 'testDone' and not event.get('hidden')]
          assert len(completed) >= 44 and all(e.get('result') == 'success' and not e.get('skipped') for e in completed)
          assert any(e.get('type') == 'done' and e.get('success') is True for e in events)
          app_events = [json.loads(line) for line in Path('test-results/student/qa-app-tests.json').read_text().splitlines() if line.startswith('{')]
          app_done = [e for e in app_events if e.get('type') == 'testDone' and not e.get('hidden')]
          assert len(app_done) >= 2 and all(e.get('result') == 'success' and not e.get('skipped') for e in app_done)
          assert any(e.get('type') == 'done' and e.get('success') is True for e in app_events)
          parity = json.loads(Path('test-results/student/dart-parity.json').read_text())
          assert parity['student_revision'] == '1cad94c88195ebea6e4737bbfc863cbe4b2ff384'
          assert {m['mode'] for m in parity['modes']} == {'kd_mixed', 'hard_only'}
          for mode in parity['modes']:
              assert mode['status'] == 'passed' and mode['frozen_classified'] == 52 and mode['frozen_rejected'] == 6
              assert mode['classified'] == 55 and mode['rejected'] == 9 and mode['max_score_delta'] <= 1e-6
          PY

      - name: Check out Hy Student MLP implementation separately
        uses: actions/checkout@v7
        with:
          ref: ${{ env.ANDROID_MLP_HANDOFF_SHA }}
          path: android-mlp-source
          persist-credentials: false

      # This includes the rejected-input UI regression. Do not hide its failure.
      - name: Verify Hy MLP implementation against Phuc reference and UI contract
        run: |
          python tests/week7/run_student_mlp_host.py \
            --android-root=android-mlp-source --student-root=student-mlp-source \
            --output=test-results/student/mlp-host.json

      - name: Upload Student verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week7-student-${{ matrix.os }}
          path: test-results/student/
          if-no-files-found: warn
          retention-days: 14
