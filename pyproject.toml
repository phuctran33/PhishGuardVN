[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard-vn"
version = "0.1.0"
description = "Week-4 templates for PhishVN EDA and URL ML baselines"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "tldextract",
    "idna",
    "joblib",
    "threadpoolctl",
]

[project.optional-dependencies]
test = ["pytest", "httpx2>=2.16,<3"]
api = ["fastapi>=0.162.2,<0.163", "uvicorn>=0.54,<0.55"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phishguard_vn = ["resources/*.csv"]
