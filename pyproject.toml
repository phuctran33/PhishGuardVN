[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard-vn"
version = "0.1.0"
description = "Week-4 templates for PhishVN EDA and URL ML baselines"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "tldextract",
    "idna",
    "joblib",
    "threadpoolctl",
]

[project.optional-dependencies]
test = ["pytest", "httpx2>=2.16,<3", "nbformat", "ipython"]
api = ["fastapi>=0.162.2,<0.163", "uvicorn>=0.54,<0.55"]
teacher-qa = ["scikit-learn==1.9.1", "numpy==2.4.6", "scipy==1.17.1", "pandas==3.1.0", "joblib==1.6.0", "tldextract==5.4.0", "idna==3.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phishguard_vn = ["resources/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "teacher: kiểm thử artifact Teacher thật từ checkout bàn giao",
    "teacher_api: nghiệm thu Teacher qua backend; chỉ chạy khi bật --teacher-api",
]
