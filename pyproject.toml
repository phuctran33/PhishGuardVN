[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard-vn"
version = "0.1.0"
description = "Week-4 templates for PhishVN EDA and URL ML baselines"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "tldextract",
    "idna",
    "joblib",
    "threadpoolctl",
]

[project.optional-dependencies]
test = ["pytest", "nbformat", "ipython"]
teacher = ["lightgbm==4.7.0", "xgboost==3.2.0", "catboost==1.2.10", "imbalanced-learn==0.14.2", "nbclient", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phishguard_vn = ["resources/*.csv"]