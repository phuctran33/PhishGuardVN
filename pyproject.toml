[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard-vn"
version = "0.1.0"
description = "Week-4 templates for PhishVN EDA and URL ML baselines"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "tldextract",
    "idna",
    "joblib",
    "threadpoolctl",
]

[project.optional-dependencies]
inference = ["scikit-learn==1.9.1"]
test = ["pytest", "nbformat", "ipython", "httpx2>=2.16,<3"]
api = ["fastapi>=0.162.2,<0.163", "uvicorn>=0.54,<0.55"]
teacher = ["lightgbm==4.7.0", "xgboost==3.2.0", "catboost==1.2.10", "imbalanced-learn==0.14.2", "nbclient", "ipykernel"]
research = ["scikit-learn==1.9.1", "torch==2.6.0", "transformers==4.48.3", "tokenizers==0.21.4", "requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phishguard_vn = ["resources/*.csv"]
