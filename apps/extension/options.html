<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cấu hình PhishGuardVN</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="options.mjs"></script>
</head>
<body>
  <main>
    <header>
      <p class="wordmark">PhishGuardVN</p>
      <h1>Cấu hình backend</h1>
    </header>
    <form class="card" id="settings">
      <label for="backend">Địa chỉ gốc FastAPI</label>
      <input required id="backend" type="url" maxlength="256" spellcheck="false"
             autocomplete="off" aria-describedby="description">
      <p class="muted" id="description">Mặc định http://127.0.0.1:8000. URL đã chọn chỉ được gửi tới backend này khi kiểm tra hoặc thử lại.</p>
      <button class="primary" id="save" type="submit">Lưu cấu hình</button>
      <p id="feedback" role="status"></p>
    </form>
  </main>
</body>
</html>
