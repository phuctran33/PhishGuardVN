name: phishguard_web
description: "PhishGuardVN URL classification demo using the Week 6 FastAPI contract."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cupertino_icons: ^2.0.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  image: ^4.13.1
  zxing2: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/scan-shield.webp

  fonts:
    - family: GuardRoboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
